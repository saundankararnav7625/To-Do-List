<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple to-do list. Add tasks, tick them off, and filter by what's left. Your list is saved in your browser.">
  <title>To-do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-do list</h1>

    <form id="todo-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="Add a task" maxlength="200" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <!-- Progress bar and count of finished tasks -->
    <div class="progress" aria-hidden="true">
      <div id="progress-bar"></div>
    </div>
    <p id="summary"></p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-message"></p>

    <button type="button" id="clear-done" hidden>Clear completed</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
